name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manual-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit
      - run: npm run build
      - name: Package and validate the deployable ZIP
        run: node scripts/release-run.cjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Test the extracted ZIP
        run: npm run test:smoke
      - name: Publish the verified release
        run: node scripts/release-run.cjs publish
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload the production site for GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: release-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  deploy-pages:
    needs: release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
          uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
